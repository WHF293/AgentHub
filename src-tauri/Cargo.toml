[package]
name = "agenthub"
version = "0.1.0"
description = "AgentHub — AI Agent 统一管理工具（WorkBuddy / ZCode / Claude Code）"
edition = "2021"

[lib]
name = "agenthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 应用壳：只依赖内核与插件包 + tauri 外壳能力；业务模块全部在 packages/*（P2 起分域）
agenthub-core = { path = "../packages/core" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = { workspace = true }
