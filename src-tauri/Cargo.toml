[package]
name = "agenthub"
version = "0.1.0"
description = "AgentHub — AI Agent 统一管理工具（WorkBuddy / ZCode / Claude Code）"
edition = "2021"

[lib]
name = "agenthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 应用壳：只依赖内核与插件包 + tauri 外壳能力；业务模块全部在 packages/*
agenthub-core = { path = "../packages/core" }
agenthub-plugin-workbuddy = { path = "../packages/workbuddy" }
agenthub-plugin-zcode = { path = "../packages/zcode" }
agenthub-plugin-claude = { path = "../packages/claude" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
