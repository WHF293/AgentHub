[workspace]
resolver = "2"
members = [
    "src-tauri",
    "packages/core",
    "packages/workbuddy",
    "packages/zcode",
    "packages/claude",
]

# 共享依赖版本集中定版（成员用 workspace = true 引用，features 由成员按需追加）
[workspace.dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
